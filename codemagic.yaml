workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.netlify.jjplaybook"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.netlify.jjplaybook
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform
        script: npx cap add ios
      - name: Set minimum iOS deployment target
        script: |
          cd ios/App
          sed -i '' -E "s/platform :ios, [\"'][0-9.]+[\"']/platform :ios, '15.0'/" Podfile
      - name: Copy web config (no auto pod install)
        script: npx cap copy ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
