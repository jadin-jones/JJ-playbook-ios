workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.netlify.jjplaybook"
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Generate app icons
        script: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate
      - name: Add iOS platform
        script: npx cap add ios
      - name: Add push notification entitlement
        script: |
          ENTITLEMENTS_FILE="ios/App/App/App.entitlements"
          if [ ! -f "$ENTITLEMENTS_FILE" ]; then
            cat > "$ENTITLEMENTS_FILE" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          EOF
          fi
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ENTITLEMENTS_FILE" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS_FILE"
          echo "--- Entitlements file contents ---"
          cat "$ENTITLEMENTS_FILE"
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj; then
            sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER = app.netlify.jjplaybook;/a\
            CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          fi
      - name: Set minimum iOS deployment target
        script: |
          cd ios/App
          sed -i '' -E "s/platform :ios, [\"'][0-9.]+[\"']/platform :ios, '15.0'/" Podfile
      - name: Fix Xcode project deployment target
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Copy web config (no auto pod install)
        script: npx cap copy ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Decode private key
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | tr -d '[:space:]' | base64 -D > /tmp/appstore_key.p8
      - name: Delete all existing distribution certificates
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/appstore_key.p8)"
          for TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            IDS=$(app-store-connect certificates list --type "$TYPE" --json 2>/dev/null | python3 -c "import sys,json; data=json.load(sys.stdin); print(' '.join(c['id'] for c in data))" 2>/dev/null)
            for CERT_ID in $IDS; do
              app-store-connect certificates delete "$CERT_ID" || true
            done
          done
      - name: Fetch signing files
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/appstore_key.p8)"
          export CERTIFICATE_PRIVATE_KEY="$(openssl genrsa 2048)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Fix code signing identity placeholder
        script: |
          sed -i '' 's/= "iOS Distribution";/= "Apple Distribution";/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Build ipa
        script: |
          set +e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
          BUILD_STATUS=$?
          echo "--- RAW XCODEBUILD LOG ---"
          find /tmp/xcodebuild_logs -name "*.log" -exec cat {} \;
          exit $BUILD_STATUS
      - name: Publish to TestFlight
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/appstore_key.p8)"
          APP_FILE=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -1)
          app-store-connect publish \
            --path "$APP_FILE" \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
