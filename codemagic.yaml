workflows:
  ios-capacitor:
    name: iOS Capacitor Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_SCHEME: "App"
        BUNDLE_ID: "app.netlify.jjplaybook"
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add iOS platform
        script: npx cap add ios
      - name: Set minimum iOS deployment target
        script: |
          cd ios/App
          sed -i '' -E "s/platform :ios, [\"'][0-9.]+[\"']/platform :ios, '15.0'/" Podfile
      - name: Copy web config (no auto pod install)
        script: npx cap copy ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Initialize keychain
        script: keychain initialize
      - name: Decode private key
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | tr -d '[:space:]' | base64 -D > /tmp/appstore_key.p8
      - name: Fetch signing files
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/appstore_key.p8)"
          export CERTIFICATE_PRIVATE_KEY="$(openssl genrsa 2048)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - - name: Build ipa
        script: |
          set +e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "$XCODE_SCHEME"
          BUILD_STATUS=$?
          echo "--- RAW XCODEBUILD LOG ---"
          find /tmp/xcodebuild_logs -name "*.log" -exec cat {} \;
          exit $BUILD_STATUS
      - name: Publish to TestFlight
        script: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat /tmp/appstore_key.p8)"
          APP_FILE=$(find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" | head -1)
          app-store-connect publish \
            --path "$APP_FILE" \
            --testflight
    artifacts:
      - build/ios/ipa/*.ipa
